name: Build installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  setup-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Rebuild app payload from source
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'heavypro-simconnect-runtime'
          Expand-Archive -LiteralPath 'packaging/HeavyProAppPayload.zip' -DestinationPath $runtime -Force
          New-Item -ItemType Directory -Force -Path 'lib' | Out-Null
          Copy-Item -LiteralPath (Join-Path $runtime 'Microsoft.FlightSimulator.SimConnect.dll') -Destination 'lib/Microsoft.FlightSimulator.SimConnect.dll' -Force
          Copy-Item -LiteralPath (Join-Path $runtime 'SimConnect.dll') -Destination 'lib/SimConnect.dll' -Force
          ./packaging/New-AppPayload.ps1 -Configuration Release
      - name: Verify bundled SimConnect runtime files
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead('packaging/HeavyProAppPayload.zip')
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            if ($names -notcontains 'HeavyPro.exe' -or $names -notcontains 'HeavyPro.exe.config') {
              throw 'The app payload is missing the executable or runtime configuration.'
            }
            if ($names -notcontains 'Microsoft.FlightSimulator.SimConnect.dll' -or $names -notcontains 'SimConnect.dll') {
              throw 'The payload is missing the SimConnect runtime files.'
            }
            if ($names -notcontains 'NOTICE-MSFS-SimConnect.txt') {
              throw 'The payload is missing the Microsoft SimConnect notice.'
            }
          } finally {
            $zip.Dispose()
          }
      - name: Build standalone setup
        run: dotnet publish src/HeavyPro.Setup/HeavyPro.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true "-p:PayloadZipPath=$pwd\packaging\HeavyProAppPayload.zip" -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: HeavyProSetup
          path: publish/HeavyProSetup.exe
