name: Build installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  setup-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify app payload excludes MSFS SDK binaries
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead('packaging/HeavyProAppPayload.zip')
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            if ($names -notcontains 'HeavyPro.exe' -or $names -notcontains 'HeavyPro.exe.config') {
              throw 'The app payload is missing the executable or runtime configuration.'
            }
            if ($names -contains 'Microsoft.FlightSimulator.SimConnect.dll' -or $names -contains 'SimConnect.dll') {
              throw 'The payload must not contain MSFS SDK binaries.'
            }
          } finally {
            $zip.Dispose()
          }
      - name: Build SDK-backed setup
        run: dotnet publish src/HeavyPro.Setup/HeavyPro.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true "-p:PayloadZipPath=$pwd\packaging\HeavyProAppPayload.zip" -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: HeavyProSetup
          path: publish/HeavyProSetup.exe
