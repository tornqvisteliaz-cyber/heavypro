name: Build installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  setup-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/HeavyPro.Setup/HeavyPro.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: HeavyProSetup
          path: publish/HeavyProSetup.exe
