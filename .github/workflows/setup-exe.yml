name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  setup-exe:
    runs-on: windows-latest
    permissions:
      contents: write  # publish the installer on the Releases page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version from the tag
        # A tag like v1.0.1 builds HeavyPro 1.0.1 (Directory.Build.props reads HP_VERSION);
        # the app's Update button compares against this number.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Release tags look like v1.0.1, not $tag." }
          "HP_VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building HeavyPro $($Matches[1])"
      - name: Built-in licence public key
        # HeavyPro trusts only licence answers signed by rotaidem.com. Its public key is built in:
        # packaging/licence-public-key.json if committed, otherwise fetched from the website here.
        # Builds that publish (main, tags) stop if there is no key; pull request builds only warn.
        shell: pwsh
        run: |
          $file = 'packaging/licence-public-key.json'
          if (-not (Test-Path $file)) {
            try {
              $jwks = Invoke-RestMethod 'https://rotaidem.com/api/licenses/jwks.json' -TimeoutSec 60
              if ($jwks.keys -and $jwks.keys[0].kty -eq 'RSA' -and $jwks.keys[0].n) {
                $jwks.keys[0] | ConvertTo-Json -Compress | Set-Content $file -Encoding utf8 -NoNewline
              } else { Write-Warning 'rotaidem.com/api/licenses/jwks.json did not contain an RSA key.' }
            } catch { Write-Warning "Could not fetch the licence public key from rotaidem.com: $_" }
          }
          if (Test-Path $file) {
            $key = Get-Content $file -Raw | ConvertFrom-Json
            if ($key.keys) { $key = $key.keys[0] }
            Write-Host "Licence public key: $($key.kid)"
          } elseif ('${{ github.event_name }}' -ne 'pull_request') {
            throw 'No licence public key. Deploy the website (setup.py deploy creates the key), then run this workflow again.'
          } else {
            Write-Warning 'Building without a licence public key: this build will refuse every licence.'
          }
      - name: Run unit tests
        run: dotnet test src/HeavyFeel.Core.Tests/HeavyFeel.Core.Tests.csproj -c Release
      - name: Build app and refresh payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path lib | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $old = [System.IO.Compression.ZipFile]::OpenRead('packaging/HeavyProAppPayload.zip')
          try {
            foreach ($name in @('SimConnect.dll', 'Microsoft.FlightSimulator.SimConnect.dll')) {
              $entry = $old.GetEntry($name)
              if ($null -eq $entry) { throw "Old payload is missing $name" }
              $dest = Join-Path 'lib' $name
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dest, $true)
            }
          } finally { $old.Dispose() }
          dotnet build src/HeavyFeel.App/HeavyFeel.App.csproj -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "App build failed." }
          & packaging/New-AppPayload.ps1 -Configuration Release
      - name: Verify bundled SimConnect runtime files
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead('packaging/HeavyProAppPayload.zip')
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            if ($names -notcontains 'HeavyPro.exe' -or $names -notcontains 'HeavyPro.exe.config') {
              throw 'The app payload is missing the executable or runtime configuration.'
            }
            if ($names -notcontains 'Microsoft.FlightSimulator.SimConnect.dll' -or $names -notcontains 'SimConnect.dll') {
              throw 'The payload is missing the SimConnect runtime files.'
            }
            if ($names -notcontains 'NOTICE-MSFS-SimConnect.txt') {
              throw 'The payload is missing the Microsoft SimConnect notice.'
            }
          } finally {
            $zip.Dispose()
          }
      - name: Build setup (.NET Framework 4.8, no bundled runtime)
        shell: pwsh
        run: |
          dotnet build src/HeavyPro.Setup/HeavyPro.Setup.csproj -c Release "-p:PayloadZipPath=$pwd\packaging\HeavyProAppPayload.zip"
          if ($LASTEXITCODE -ne 0) { throw "Setup build failed." }
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          Copy-Item src/HeavyPro.Setup/bin/Release/net48/HeavyProSetup.exe publish/
          $size = (Get-Item publish/HeavyProSetup.exe).Length
          $payload = (Get-Item packaging/HeavyProAppPayload.zip).Length
          Write-Host ("HeavyProSetup.exe is {0:N1} MB, app payload {1:N1} MB" -f ($size / 1MB), ($payload / 1MB))
          # With no bundled runtime the setup is the payload plus ~100 KB, under 1 MB today,
          # so compare against the payload itself rather than a fixed size.
          if ($size -lt $payload) { throw "HeavyProSetup.exe is smaller than the app payload; the payload was not embedded." }
      - name: Add a zip and a checksum for testers
        shell: pwsh
        run: |
          # Some browsers, mail filters and company networks block bare .exe downloads; a zip gets through.
          Compress-Archive -Path publish/HeavyProSetup.exe -DestinationPath publish/HeavyProSetup.zip -Force
          $hash = (Get-FileHash publish/HeavyProSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  HeavyProSetup.exe" | Set-Content publish/SHA256SUMS.txt -Encoding ascii
          Write-Host "SHA-256: $hash"
      - name: Sign the update manifest
        # update.jws tells the app's Update button about this release. It is signed with the
        # update key (secret UPDATE_SIGNING_KEY), so only releases built here are installed.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/HeavyProSetup.exe"
          & packaging/New-UpdateManifest.ps1 -Version $env:HP_VERSION -Setup publish/HeavyProSetup.exe -Url $url -Out publish/update.jws
      - uses: actions/upload-artifact@v4
        with:
          name: HeavyProSetup
          path: publish/HeavyProSetup.exe
      # Artifacts above need a GitHub login and expire after 90 days, so testers and customers download
      # from the Releases page instead. Every build of main replaces the files of the "beta" release,
      # so this link always gives the newest build:
      #   https://github.com/tornqvisteliaz-cyber/heavypro/releases/download/beta/HeavyProSetup.exe
      # A tag like v1.0.0 creates a release of its own (the link .../releases/latest/download/... then
      # points to it).
      - name: Publish the beta build
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view beta *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create beta --title "HeavyPro beta" --prerelease --notes "Newest test build of HeavyPro, rebuilt from main automatically."
            if ($LASTEXITCODE -ne 0) { throw "Could not create the beta release." }
          }
          gh release upload beta publish/HeavyProSetup.exe publish/HeavyProSetup.zip publish/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the installer to the beta release." }
      - name: Publish a versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "HeavyPro $tag" --generate-notes --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag." }
          }
          gh release upload $tag publish/HeavyProSetup.exe publish/HeavyProSetup.zip publish/SHA256SUMS.txt publish/update.jws --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the installer to release $tag." }
